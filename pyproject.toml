[project]
name = "do-it-local"
version = "0.1.0"
description = "AI-powered local dev environment generator — analyzes codebases, detects PII, generates docker-compose configs"
authors = [
    {name = "SlimeStack"},
]
dependencies = [
    # Google ADK
    "google-adk>=1.15.0,<2.0.0",
    "google-genai>=1.0.0",
    # GitLab integration
    "python-gitlab>=5.0.0,<6.0.0",
    # Backend
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "google-cloud-firestore>=2.19.0,<3.0.0",
    "google-cloud-logging>=3.12.0,<4.0.0",
    # Utilities
    "tenacity>=9.0.0,<10.0.0",
    "ruamel.yaml>=0.18.0,<1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]
requires-python = ">=3.11,<3.14"

[dependency-groups]
dev = [
    "pytest>=8.3.4,<9.0.0",
    "pytest-asyncio>=0.23.8,<1.0.0",
    "ruff>=0.4.6,<1.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "backend"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.wheel]
packages = ["app", "backend"]
